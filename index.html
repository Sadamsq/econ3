<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Econ Flow Diagram</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>Econ Flow Diagram</h1>
        <p>Drag to pan · Scroll to zoom · Tap or click a node to focus it</p>
      </div>
      <div class="controls" aria-label="Zoom controls">
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
        <button id="reset" type="button" aria-label="Reset view">Reset</button>
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      </div>
    </header>

    <main class="workspace">
      <section class="viewport" id="viewport" aria-label="Zoomable diagram">
        <div class="scene" id="scene">
          <img class="scene-image" src="test4.png"> <!-- MAIN BACKGROUND IMAGE -->
                    <div id="hotspots"></div>
        </div>

        <aside class="inspector" id="inspector" aria-live="polite">
          <div class="inspector-label">Focused node</div>
          <h2 id="focus-title">Overview</h2>
          <p id="focus-desc">Use the nodes to jump around the diagram. The view stays pan- and zoom-friendly on every screen size.</p>
        </aside>
      </section>
    </main>
  </div>

  <script>
    const diagramW = 2047;
    const diagramH = 939;

    const hotspots = [
      { id: 'actual-interest-rate', label: 'Actual Interest Rate', desc: 'Left-side status panel with the current interest-rate summary.', x: 5.2, y: 17.5, w: 13.5, h: 13.0 },
      { id: 'hh-summary', label: 'Households Summary', desc: 'Household savings, debt, and balance-sheet summary boxes.', x: 6.4, y: 53.0, w: 18.5, h: 20.0 },
      { id: 'foreign-top', label: 'Foreign Sector', desc: 'Top-left foreign-sector node used in the upper accounting flow.', x: 19.2, y: 10.0, w: 8.0, h: 5.5 },
      { id: 'banks-top', label: 'Banks / Financial Institutions', desc: 'Upper banking sector node linked into the top accounting loop.', x: 32.4, y: 0.4, w: 8, h: 8.0 },
      { id: 'treasury-top', label: 'Treasury', desc: 'Upper treasury node in the main loop.', x: 45.0, y: 10.0, w: 8.0, h: 6.0 },
      { id: 'fed-top', label: 'FED', desc: 'Upper central FED node with the click target below it.', x: 33.8, y: 13.0, w: 4, h: 8.5 },
      { id: 'households', label: 'Households', desc: 'Central household node that ties into savings, wages, and debt flows.', x: 16, y: 35.0, w: 8.2, h: 9.5 },
      { id: 'firms', label: 'Firms', desc: 'Central firms node with many incoming and outgoing arrows.', x: 47.3, y: 29.5, w: 7.4, h: 9.2 },
      { id: 'banks-mid', label: 'Banks / Financial Institutions', desc: 'Mid-right banking node in the lower flow network.', x: 60.7, y: 31.0, w: 10.5, h: 8.5 },
      { id: 'foreign-mid', label: 'Foreign Sector', desc: 'Mid-right foreign sector node connected to imports and investment.', x: 69.2, y: 31.0, w: 10.0, h: 8.5 },
      { id: 'income-panel', label: 'Income Panel', desc: 'Income allocation panel on the upper right side.', x: 68.7, y: 0.3, w: 19.2, h: 25.7 },
      { id: 'income-box', label: 'Income', desc: 'Highlighted income box showing wages, profits, and taxes.', x: 79.0, y: 14.9, w: 12.9, h: 13.3 },
      { id: 'expenditures-panel', label: 'Expenditures Panel', desc: 'Expenditure allocation panel on the lower right side.', x: 53.7, y: 41.0, w: 31.0, h: 28.5 },
      { id: 'expenditures-box', label: 'Expenditures', desc: 'Highlighted expenditure box showing consumption, investment, government spending, and net exports.', x: 69.0, y: 41.0, w: 11.8, h: 14.0 },
      { id: 'totals-right', label: 'Totals Panel', desc: 'Total HH and government debt, financing, and private money created boxes.', x: 68.7, y: 57.0, w: 18.0, h: 16.7 },
      { id: 'list-income', label: 'Income Distribution List', desc: 'Detailed line-item list for income distribution relationships.', x: 55.0, y: 0.0, w: 13.4, h: 25.8 },
    ];

    const hotspotRoot = document.getElementById('hotspots');
    const focusTitle = document.getElementById('focus-title');
    const focusDesc = document.getElementById('focus-desc');
    const viewport = document.getElementById('viewport');
    const scene = document.getElementById('scene');

    let scale = 1;
    let panX = 0;
    let panY = 0;
    const minScale = 0.35;
    const maxScale = 4;

    function applyTransform(instant = false) {
      scene.style.transition = instant ? 'none' : 'transform 180ms ease-out';
      scene.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function getViewportRect() {
      return viewport.getBoundingClientRect();
    }

    function setFocus(h, zoom = null) {
      const rect = getViewportRect();
      const targetScale = zoom ?? Math.min(maxScale, Math.max(minScale, Math.min(rect.width / (diagramW * 0.28), rect.height / (diagramH * 0.28))));
      const cx = (h.x + h.w / 2) / 100 * diagramW;
      const cy = (h.y + h.h / 2) / 100 * diagramH;

      scale = targetScale;
      panX = rect.width / 2 - cx * scale;
      panY = rect.height / 2 - cy * scale;

      applyTransform();
      focusTitle.textContent = h.label;
      focusDesc.textContent = h.desc;
    }

    function resetView() {
      const rect = getViewportRect();
      const fit = Math.min(rect.width / diagramW, rect.height / diagramH);
      scale = Math.max(minScale, fit);
      panX = (rect.width - diagramW * scale) / 2;
      panY = (rect.height - diagramH * scale) / 2;
      applyTransform(true);
      focusTitle.textContent = 'Overview';
      focusDesc.textContent = 'Use the nodes to jump around the diagram. The view stays pan- and zoom-friendly on every screen size.';
    }

    function makeHotspots() {
      hotspots.forEach((h) => {
        const a = document.createElement('a');
        a.className = 'hotspot';
        a.href = `#${h.id}`;
        a.dataset.focus = h.id;
        a.dataset.label = h.label;
        a.style.left = h.x + '%';
        a.style.top = h.y + '%';
        a.style.width = h.w + '%';
        a.style.height = h.h + '%';
        a.setAttribute('aria-label', h.label);
        a.title = h.label;
        a.id = h.id;
        a.innerHTML = `<span class="hotspot-chip">${h.label}</span>`;
        a.addEventListener('click', (e) => {
          e.preventDefault();
          setFocus(h);
        });
        hotspotRoot.appendChild(a);
      });
    }

    let pointerDown = false;
    let startX = 0, startY = 0, originX = 0, originY = 0, moved = false;

    viewport.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.hotspot') || e.target.closest('button')) return;
      pointerDown = true;
      moved = false;
      startX = e.clientX;
      startY = e.clientY;
      originX = panX;
      originY = panY;
      viewport.setPointerCapture(e.pointerId);
    });

    viewport.addEventListener('pointermove', (e) => {
      if (!pointerDown) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      panX = originX + dx;
      panY = originY + dy;
      applyTransform(true);
    });

    viewport.addEventListener('pointerup', (e) => {
      pointerDown = false;
      try { viewport.releasePointerCapture(e.pointerId); } catch {}
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = getViewportRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      const beforeX = (mx - panX) / scale;
      const beforeY = (my - panY) / scale;

      const delta = Math.sign(e.deltaY) * -0.12;
      const nextScale = Math.min(maxScale, Math.max(minScale, scale * (1 + delta)));

      panX = mx - beforeX * nextScale;
      panY = my - beforeY * nextScale;
      scale = nextScale;
      applyTransform(true);
    }, { passive: false });

    document.getElementById('zoom-in').addEventListener('click', () => {
      const rect = getViewportRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const beforeX = (cx - panX) / scale;
      const beforeY = (cy - panY) / scale;
      scale = Math.min(maxScale, scale * 1.15);
      panX = cx - beforeX * scale;
      panY = cy - beforeY * scale;
      applyTransform();
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
      const rect = getViewportRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const beforeX = (cx - panX) / scale;
      const beforeY = (cy - panY) / scale;
      scale = Math.max(minScale, scale / 1.15);
      panX = cx - beforeX * scale;
      panY = cy - beforeY * scale;
      applyTransform();
    });

    document.getElementById('reset').addEventListener('click', resetView);

    window.addEventListener('resize', () => {
      resetView();
    });

    makeHotspots();
    resetView();
  </script>
</body>
</html>
